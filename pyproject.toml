[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simcombat"
version = "0.1.0"
description = "Similarity-informed empirical Bayes ComBat research implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.18.1",
    "pandas==2.3.3",
    "patsy==1.0.3",
    "statsmodels==0.14.6",
    "scikit-learn==1.9.0",
    "matplotlib==3.10.9",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
